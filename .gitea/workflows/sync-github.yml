name: Sync GitHub mirror

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  mirror:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest-arm64
    container:
      image: node:24-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates
      - name: Checkout source
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source and history
        shell: bash
        run: |
          bash scripts/install-gitleaks.sh
          gitleaks git . --redact --exit-code 1
          gitleaks dir . --redact --exit-code 1
      - name: Sync master to GitHub
        shell: bash
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: bash scripts/mirror-github.sh "$SOURCE_COMMIT"
